[project]
name = "react-agent"
version = "0.0.1"
description = "Starter template for making a custom Reasoning and Action agent (using tool calling) in LangGraph."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.6",
    "langchain-openai>=0.1.22",
    "langchain-anthropic>=0.1.23",
    "langchain>=0.3.19",
    "langchain-fireworks>=0.1.7",
    "python-dotenv>=1.0.1",
    "langchain-community>=0.2.17",
    "tavily-python>=0.4.0",
    "python-fasthtml>=0.12.1",
    "langgraph-sdk>=0.1.57",
    "langchain-deepseek>=1.1.0",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.0.0",
    "sentence-transformers>=5.0.0",
    "pypdf>=6.0.0",
]


[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.react_agent", "react_agent"]
[tool.setuptools.package-dir]
"langgraph.templates.react_agent" = "src/react_agent"
"react_agent" = "src/react_agent"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
# Template UI file kept as-is from the LangGraph starter; not ours to reformat.
"src/react_agent/app.py" = ["I001"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# `python-fasthtml` ships no type stubs; `react_agent.web` is still checked in
# strict mode, but its FastHTML imports are treated as untyped (everything the
# web layer derives from them is annotated explicitly).
[[tool.mypy.overrides]]
module = ["fasthtml.*", "fastcore.*", "starlette.*", "langgraph_sdk.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "langgraph-api>=0.0.30",
    "langgraph-cli[inmem]>=0.1.83",
    "mypy>=1.11.1",
    "pytest>=8.3.4",
    "ruff>=0.6.1",
]
